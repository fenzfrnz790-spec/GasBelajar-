<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GasBelajar</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f4f7fb;
      color: #222;
      text-align: center;
    }

    header {
      background: #2563eb;
      color: white;
      padding: 35px 20px;
    }

    header h1 {
      margin: 0;
      font-size: 36px;
    }

    header p {
      font-size: 18px;
    }

    .menu {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      max-width: 500px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .card {
      background: white;
      padding: 25px 10px;
      border-radius: 15px;
      box-shadow: 0 3px 10px #0002;
      font-size: 18px;
    }

    footer {
      margin-top: 30px;
      padding: 20px;
      background: #ddd;
    }
  </style>
</head>

<body>

  <header>
    <h1>📚 GasBelajar</h1>
    <p>Belajar lebih mudah, seru, dan menyenangkan!</p>
  </header>

  <div class="menu">
    <div class="card">🧮 Matematika</div>
    <div class="card">🔬 IPA</div>
    <div class="card">🌏 IPS</div>
    <div class="card">🇮🇩 Bahasa Indonesia</div>
  </div>

  <footer>
    GasBelajar © 2026
  </footer>

</body>
</html>
